name: Atualizar dados do TSE

# Baixa os resultados do TSE, guarda em dados/ e publica o site no GitHub Pages.
# Roda a cada 5 minutos, quando você clica em "Run workflow" e quando o site é
# alterado. Durante a apuração, cada rodada já pede a seguinte, porque o
# agendamento do GitHub costuma atrasar nos horários de pico.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      origem:
        description: 'Quem pediu a rodada (deixe "manual")'
        required: false
        default: manual
  push:
    branches: [main]
    paths-ignore:
      - 'dados/**'

# Uma rodada por vez (a próxima espera a anterior terminar)
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # para guardar os dados no repositório
    outputs:
      publicar: ${{ steps.guardar.outputs.mudou == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.origem != 'robo') }}
      seguir: ${{ steps.coletar.outputs.seguir }}
      espera: ${{ steps.coletar.outputs.espera }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Coletar resultados do TSE
        id: coletar
        # Se a coleta falhar, o site é publicado mesmo assim com os dados anteriores
        continue-on-error: true
        env:
          # Período em que uma rodada emenda na outra (UTC; 17h de Brasília = 20h UTC)
          ENCADEAR_DE: '2026-10-25T17:20:00Z'
          ENCADEAR_ATE: '2026-10-26T15:00:00Z'
        run: node scripts/coletar.mjs

      - name: Guardar os dados no repositório
        id: guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "Dados do TSE: $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            git push -q || echo "::warning::Não consegui guardar os dados agora; tento de novo na próxima rodada."
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Empacotar o site
        if: steps.guardar.outputs.mudou == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.origem != 'robo')
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: coletar
    if: needs.coletar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4

  # Durante a apuração, já pede a próxima rodada: ela começa assim que esta terminar
  encadear:
    needs: coletar
    if: needs.coletar.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Pedir a próxima rodada
        env:
          GH_TOKEN: ${{ github.token }}
          ESPERA: ${{ needs.coletar.outputs.espera }}
        run: |
          sleep "${ESPERA:-0}"
          gh workflow run atualizar-dados.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f origem=robo
