name: Atualizar dados do TSE

# Roda a cada 5 minutos, quando você clica em "Run workflow" e quando
# o site é alterado. Baixa os resultados do TSE, guarda em dados/ e
# publica o site no GitHub Pages.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'dados/**'

# Uma rodada por vez (a próxima espera a anterior terminar)
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # para guardar os dados no repositório
    outputs:
      publicar: ${{ steps.guardar.outputs.mudou == 'true' || github.event_name != 'schedule' }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Coletar resultados do TSE
        # Se a coleta falhar, o site é publicado mesmo assim com os dados anteriores
        continue-on-error: true
        run: node scripts/coletar.mjs

      - name: Guardar os dados no repositório
        id: guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "Dados do TSE: $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            git push -q || echo "::warning::Não consegui guardar os dados agora; tento de novo na próxima rodada."
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Empacotar o site
        if: steps.guardar.outputs.mudou == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: coletar
    if: needs.coletar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
